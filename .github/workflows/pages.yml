# 每次推送到 main：先跑全部自動測試，通過後才把 public/ 發佈到 GitHub Pages。
# 測試失敗 → 不會發佈（學生繼續用舊版本）。
name: 測試及發佈到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 自動測試
        run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: 發佈
        id: deployment
        uses: actions/deploy-pages@v4
